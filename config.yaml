# ─────────────────────────────────────────────────────────────────
# Qwen3 HADR Translation Fine-tuning Configuration
# ─────────────────────────────────────────────────────────────────

model:
  name: "Qwen/Qwen3-8B"         # swap to Qwen3-4B for smaller GPU
  use_4bit: true                  # QLoRA — set false if you have 40 GB+ VRAM

lora:
  enabled: true
  r: 16                           # LoRA rank (8–64; higher = more capacity)
  alpha: 32                       # LoRA scaling (typically 2 × r)
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

data:
  path: "clean.jsonl" # local JSONL or HuggingFace dataset name
  max_length: 512                 # max tokens per example (prompt + response)

training:
  output_dir: "./checkpoints"
  epochs: 5
  batch_size: 4                   # per-device; reduce to 2 on 16 GB cards
  eval_batch_size: 4
  gradient_accumulation_steps: 4  # effective batch = batch_size × accum_steps
  learning_rate: 2.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 10
  eval_steps: 500
  save_steps: 500
  save_total_limit: 3
  packing: false                  # set true to pack short sequences for speed
  report_to: "tensorboard"        # "wandb" also supported
  run_name: "qwen3-hadr-translation"

inference:
  max_new_tokens: 256
